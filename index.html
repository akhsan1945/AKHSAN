<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nart Bake Online Cashier</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f7eee8;color:#432719}header{background:#5b2d1b;color:white;padding:18px;font-size:24px;font-weight:bold}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:white;border-radius:14px;padding:18px;margin:15px 0;box-shadow:0 5px 20px #0001}input,select{padding:10px;width:100%;box-sizing:border-box;margin:5px 0 12px;border:1px solid #d8c9bf;border-radius:7px}button{padding:10px 14px;border:0;border-radius:7px;font-weight:bold;cursor:pointer}.brown{background:#5b2d1b;color:white}.light{background:#eee2db}.red{background:#f3d7d2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:grid;grid-template-columns:60px 1fr 130px 130px 40px;gap:8px;align-items:end;margin:8px 0}.receipt{max-width:700px;margin:auto;padding:40px;background:#fff}.brand{text-align:center}.circle{width:135px;height:135px;border:4px solid #63351f;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center}.brandname{font:700 34px Georgia}.title{text-align:center;background:#633018;color:white;font-size:36px;font-weight:bold;padding:12px;margin:25px}.bill{text-align:center;font-size:24px;font-weight:bold}table{width:100%;border-collapse:collapse;margin-top:20px}th{background:#633018;color:white;padding:9px}td{padding:9px;border-bottom:1px solid #ddd}th:nth-child(n+3),td:nth-child(n+3){text-align:right}.summary{margin-left:45%;border-top:2px dashed #987461;padding-top:12px}.total{font-size:22px;font-weight:bold;display:flex;justify-content:space-between}.hidden{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{grid-template-columns:50px 1fr 90px 100px 35px}.receipt{padding:20px}.summary{margin-left:15%}}@media print{header,.tabs,.no-print{display:none!important}body{background:white}.receipt{box-shadow:none}}</style></head><body><header>nart bake <span id="userLabel" style="float:right;font-size:14px">Belum login</span></header>
<div id="login" class="wrap"><div class="card" style="max-width:400px;margin:60px auto"><h2>Login Kasir</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><p id="err"></p><button class="brown" onclick="login()">Masuk</button></div></div>
<div id="app" class="wrap hidden"><div class="tabs"><button class="brown" onclick="show('cashier')">🧾 Kasir</button><button class="light" onclick="show('products')">📦 Produk</button><button class="light" onclick="show('history')">📊 Riwayat</button><button class="red" onclick="logout()">Keluar</button></div>
<section id="cashier"><div class="card"><div class="grid"><div><label>Nama Pemesan</label><input id="customer"></div><div><label>Invoice</label><input id="invoice" readonly></div><div><label>Diskon</label><input id="discount" type="number" value="0"></div><div><label>Shipping</label><input id="shipping" type="number" value="0"></div></div><h3>Order</h3><div id="items"></div><button class="light" onclick="addRow()">+ Produk</button><p><button class="brown" onclick="saveSale()">Simpan Transaksi</button> <button class="light" onclick="print()">Cetak / PDF</button> <button class="red" onclick="newSale()">Baru</button></p><p id="msg"></p></div><div class="card"><div id="receipt"></div></div></section>
<section id="products" class="hidden"><div class="card"><h2>Produk & Harga</h2><div id="productEditor"></div><button class="brown" onclick="addProduct()">+ Tambah Produk</button></div></section>
<section id="history" class="hidden"><div class="card"><h2>Riwayat Penjualan</h2><div id="historyRows"></div></div></section></div>
<script>
const SUPABASE_URL = "https://evpgnywtzdqnxkndgwxc.supabase.co";
const SUPABASE_KEY = "sb_publishable_uM9R6_nTT99RW4Sjt1ArcA_kw6fWgkn";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [];
let rows = [];
let profile;
const rp=n=>new Intl.NumberFormat("id-ID").format(Number(n)||0),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function login(){let {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error)err.textContent=error.message}
async function boot(){let {data:{session}}=await db.auth.getSession();if(session)start(session)}
async function start(s){let r=await db.from("profiles").select("*").eq("id",s.user.id).single();if(r.error)return alert("Profile belum terhubung ke User ID.");profile=r.data;userLabel.textContent=(profile.full_name||s.user.email)+" · "+profile.role;loginEl(false);await load();newSale()}
function loginEl(x){document.getElementById("login").classList.toggle("hidden",!x);document.getElementById("app").classList.toggle("hidden",x)}
async function logout(){await db.auth.signOut();location.reload()}
async function load(){let r=await db.from("products").select("*").eq("active",true).order("id");products=r.data||[]}
function addRow(){rows.push({product_id:products[0]?.id,qty:1});render()}
function p(id){return products.find(x=>x.id==id)}
function totals(){let sub=rows.reduce((s,r)=>s+(p(r.product_id)?.price||0)*r.qty,0),d=+discount.value||0,sh=+shipping.value||0;return{sub,d,sh,total:Math.max(0,sub-d+sh)}}
function render(){items.innerHTML=rows.map((r,i)=>{let x=p(r.product_id)||{name:"-",price:0};return `<div class="row"><input type="number" min="1" value="${r.qty}" onchange="rows[${i}].qty=+this.value||1;render()"><select onchange="rows[${i}].product_id=+this.value;render()">${products.map(x=>`<option value="${x.id}" ${x.id==r.product_id?"selected":""}>${esc(x.name)}</option>`).join("")}</select><input readonly value="Rp ${rp(x.price)}"><b style="text-align:right">Rp ${rp(x.price*r.qty)}</b><button class="red" onclick="rows.splice(${i},1);render()">×</button></div>`}).join("");let t=totals();receipt.innerHTML=`<div class="receipt"><div class="brand"><div class="circle"><div class="brandname">nart<br>bake</div></div></div><div class="title">e-receipt</div><div class="bill">Bill to<br>${esc(customer.value||"—")}</div><p>Invoice: ${invoice.value}</p><table><tr><th>Qty</th><th>Description</th><th>Price</th><th>Amount</th></tr>${rows.map(r=>{let x=p(r.product_id)||{name:"-",price:0};return `<tr><td>${r.qty}</td><td>${esc(x.name)}</td><td>${rp(x.price)}</td><td>${rp(x.price*r.qty)}</td></tr>`}).join("")}</table><div class="summary"><p>Subtotal: <b>Rp ${rp(t.sub)}</b></p><p>Discount: <b>Rp ${rp(t.d)}</b></p><p>Shipping: <b>Rp ${rp(t.sh)}</b></p><div class="total"><span>Total</span><span>Rp ${rp(t.total)}</span></div></div><hr><center><b>thank you for order</b><p>have a nart day ♡</p></center></div>`}
async function nextInvoice(){let r=await db.from("orders").select("invoice_no").order("created_at",{ascending:false}).limit(1);let n=1,m=r.data?.[0]?.invoice_no?.match(/(\d+)$/);if(m)n=+m[1]+1;return "NB/"+String(n).padStart(6,"0")}
async function newSale(){rows=products.length?[{product_id:products[0].id,qty:1}]:[];customer.value="";discount.value=0;shipping.value=0;invoice.value=await nextInvoice();render()}
async function saveSale(){if(!customer.value.trim())return msg.textContent="Isi nama pemesan.";let t=totals();let a=await db.from("orders").insert({invoice_no:invoice.value,customer_name:customer.value.trim(),cashier_id:profile.id,subtotal:t.sub,discount:t.d,shipping:t.sh,total:t.total}).select().single();if(a.error)return msg.textContent=a.error.message;let details=rows.map(r=>{let x=p(r.product_id);return{order_id:a.data.id,product_id:x.id,product_name:x.name,qty:r.qty,unit_price:x.price,amount:x.price*r.qty}});let b=await db.from("order_items").insert(details);if(b.error)return msg.textContent=b.error.message;msg.textContent="Tersimpan online.";newSale()}
async function show(id){["cashier","products","history"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!=id));if(id=="products")renderProducts();if(id=="history")renderHistory()}
async function renderProducts(){let r=await db.from("products").select("*").order("id");productEditor.innerHTML=(r.data||[]).map(x=>`<div class="row" style="grid-template-columns:1fr 150px 80px 40px"><input value="${esc(x.name)}" onchange="upd(${x.id},'name',this.value)"><input type="number" value="${x.price}" onchange="upd(${x.id},'price',+this.value)"><input type="checkbox" ${x.active?"checked":""} onchange="upd(${x.id},'active',this.checked)"><button class="red" onclick="upd(${x.id},'active',false)">×</button></div>`).join("")}
async function upd(id,k,v){await db.from("products").update({[k]:v}).eq("id",id);await load();renderProducts();render()}
async function addProduct(){let n=prompt("Nama produk");if(!n)return;let pr=+prompt("Harga","0");await db.from("products").insert({name:n,price:pr,active:true});await load();renderProducts()}
async function renderHistory(){let r=await db.from("orders").select("invoice_no,customer_name,total,created_at").order("created_at",{ascending:false});historyRows.innerHTML="<table>"+(r.data||[]).map(x=>`<tr><td>${esc(x.invoice_no)}</td><td>${esc(x.customer_name)}</td><td>${new Date(x.created_at).toLocaleString("id-ID")}</td><td>Rp ${rp(x.total)}</td></tr>`).join("")+"</table>"}
[customer,discount,shipping].forEach(x=>x.addEventListener("input",render));boot();
</script></body></html>
