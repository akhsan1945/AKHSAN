<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nart Bake Online Cashier V2.1</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{font-family:Arial;margin:0;background:#f7eee8;color:#432719}header{background:#5b2d1b;color:white;padding:18px;font-size:24px;font-weight:bold}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:white;border-radius:14px;padding:18px;margin:15px 0;box-shadow:0 5px 20px #0001}input,select{padding:10px;width:100%;box-sizing:border-box;margin:5px 0 12px;border:1px solid #d8c9bf;border-radius:7px}button{padding:10px 14px;border:0;border-radius:7px;font-weight:bold;cursor:pointer}.brown{background:#5b2d1b;color:white}.light{background:#eee2db}.red{background:#f3d7d2}.green{background:#dcefe1;color:#245b32}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:grid;grid-template-columns:60px 1fr 130px 130px 40px;gap:8px;align-items:end;margin:8px 0}.receipt{max-width:700px;margin:auto;padding:40px;background:#fff}.brand{text-align:center}.circle{width:135px;height:135px;border:4px solid #63351f;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center}.brandname{font:700 34px Georgia}.title{text-align:center;background:#633018;color:white;font-size:36px;font-weight:bold;padding:12px;margin:25px}.bill{text-align:center;font-size:24px;font-weight:bold}table{width:100%;border-collapse:collapse;margin-top:20px}th{background:#633018;color:white;padding:9px}td{padding:9px;border-bottom:1px solid #ddd}th:nth-child(n+3),td:nth-child(n+3){text-align:right}.summary{margin-left:45%;border-top:2px dashed #987461;padding-top:12px}.total{font-size:22px;font-weight:bold;display:flex;justify-content:space-between}.hidden{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.actions{display:flex;gap:6px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.modal-box{background:#fff;border-radius:14px;max-width:800px;width:100%;max-height:90vh;overflow:auto;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.history-wrap{overflow:auto}.history-table{min-width:850px}.history-table td,.history-table th{font-size:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{grid-template-columns:50px 1fr 90px 100px 35px}.receipt{padding:20px}.summary{margin-left:15%}}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;background:white;color:#432719}#printArea .receipt{display:block!important;max-width:700px;margin:auto;padding:30px;box-shadow:none}.no-print{display:none!important}}
</style></head><body><header>nart bake <span id="userLabel" style="float:right;font-size:14px">Belum login</span></header>
<div id="login" class="wrap"><div class="card" style="max-width:400px;margin:60px auto"><h2>Login Kasir</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><p id="err" style="min-height:20px;font-weight:bold"></p><button class="brown" onclick="login()">Masuk</button></div></div>
<div id="app" class="wrap hidden"><div class="tabs"><button class="brown" onclick="show('cashier')">🧾 Kasir</button><button class="light" onclick="show('products')">📦 Produk</button><button class="light" onclick="show('history')">📊 Riwayat</button><button class="red" onclick="logout()">Keluar</button></div>
<section id="cashier"><div class="card"><div class="grid"><div><label>Nama Pemesan</label><input id="customer"></div><div><label>Invoice</label><input id="invoice" readonly></div><div><label>Diskon</label><input id="discount" type="number" value="0"></div><div><label>Shipping</label><input id="shipping" type="number" value="0"></div></div><h3>Order</h3><div id="items"></div><button class="light" onclick="addRow()">+ Produk</button><p><button class="brown" onclick="saveSale()">Simpan Transaksi</button> <button class="light" onclick="printCurrent()">Cetak / PDF</button> <button class="red" onclick="newSale()">Baru</button></p><p id="msg"></p></div><div class="card"><div id="receipt"></div></div></section>
<section id="products" class="hidden"><div class="card"><h2>Produk & Harga</h2><div id="productEditor"></div><button class="brown" onclick="addProduct()">+ Tambah Produk</button></div></section>
<section id="history" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Riwayat Penjualan</h2><button class="light" onclick="renderHistory()">↻ Refresh</button></div><div id="historyRows"></div></div></section></div>
<div id="printArea" class="hidden"></div>
<div id="detailModal" class="modal hidden"><div class="modal-box"><div class="modal-head no-print"><h2>Detail E-Receipt</h2><button type="button" class="red" onclick="closeDetail()">Tutup</button></div><div id="detailReceipt"></div><div class="actions no-print" style="margin-top:12px"><button class="brown" onclick="printDetail()">🖨️ Cetak / Simpan PDF</button><button class="green" onclick="shareDetailWhatsApp()">📱 WhatsApp</button></div></div></div>
<script>
const SUPABASE_URL="https://evpgnywtzdqnxkndgwxc.supabase.co",SUPABASE_KEY="sb_publishable_uM9R6_nTT99RW4Sjt1ArcA_kw6fWgkn",db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let products=[],rows=[],profile,currentDetail=null;
const rp=n=>new Intl.NumberFormat("id-ID").format(Number(n)||0),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function login(){const e=document.getElementById("email").value.trim(),pw=document.getElementById("password").value,er=document.getElementById("err");er.textContent="Memeriksa login...";try{const{data,error}=await db.auth.signInWithPassword({email:e,password:pw});if(error){er.textContent="Login gagal: "+error.message;return}await start(data.session)}catch(x){er.textContent="Error: "+x.message}}
async function boot(){let{data:{session}}=await db.auth.getSession();if(session)await start(session)}
async function start(s){let r=await db.from("profiles").select("*").eq("id",s.user.id).single();if(r.error){err.textContent="Login berhasil, tetapi profile belum terhubung: "+r.error.message;return}profile=r.data;userLabel.textContent=(profile.full_name||s.user.email)+" · "+(profile.role||"kasir");loginEl(false);await load();await newSale()}
function loginEl(x){login.classList.toggle("hidden",!x);app.classList.toggle("hidden",x)}async function logout(){await db.auth.signOut();location.reload()}
async function load(){let r=await db.from("products").select("*").eq("active",true).order("id");products=r.data||[]}
function addRow(){if(!products.length)return alert("Belum ada produk aktif.");rows.push({product_id:products[0].id,qty:1});render()}function p(id){return products.find(x=>x.id==id)}
function totals(){let sub=rows.reduce((s,r)=>s+(p(r.product_id)?.price||0)*r.qty,0),d=+discount.value||0,sh=+shipping.value||0;return{sub,d,sh,total:Math.max(0,sub-d+sh)}}
function render(){items.innerHTML=rows.map((r,i)=>{let x=p(r.product_id)||{name:"-",price:0};return `<div class="row"><input type="number" min="1" value="${r.qty}" onchange="rows[${i}].qty=+this.value||1;render()"><select onchange="rows[${i}].product_id=+this.value;render()">${products.map(x=>`<option value="${x.id}" ${x.id==r.product_id?"selected":""}>${esc(x.name)}</option>`).join("")}</select><input readonly value="Rp ${rp(x.price)}"><b style="text-align:right">Rp ${rp(x.price*r.qty)}</b><button class="red" onclick="rows.splice(${i},1);render()">×</button></div>`}).join("");let t=totals();receipt.innerHTML=receiptHTML({invoice:invoice.value,customer:customer.value,rows,subtotal:t.sub,discount:t.d,shipping:t.sh,total:t.total,created_at:new Date().toISOString()})}
function receiptHTML(o){return `<div class="receipt"><div class="brand"><div class="circle"><div class="brandname">nart<br>bake</div></div></div><div class="title">e-receipt</div><div class="bill">Bill to<br>${esc(o.customer||"—")}</div><p><b>Invoice:</b> ${esc(o.invoice)}</p><p><b>Tanggal:</b> ${o.created_at?new Date(o.created_at).toLocaleString("id-ID"):"-"}</p><table><tr><th>Qty</th><th>Description</th><th>Price</th><th>Amount</th></tr>${(o.rows||[]).map(r=>{let x=r.product||p(r.product_id)||{name:r.product_name||"-",price:r.unit_price||0};return `<tr><td>${r.qty}</td><td>${esc(x.name||r.product_name)}</td><td>Rp ${rp(x.price??r.unit_price)}</td><td>Rp ${rp(r.amount??((x.price??r.unit_price)*r.qty))}</td></tr>`}).join("")}</table><div class="summary"><p>Subtotal: <b>Rp ${rp(o.subtotal)}</b></p><p>Discount: <b>Rp ${rp(o.discount)}</b></p><p>Shipping: <b>Rp ${rp(o.shipping)}</b></p><div class="total"><span>Total</span><span>Rp ${rp(o.total)}</span></div></div><hr><center><b>thank you for order</b><p>have a nart day ♡</p></center></div>`}
async function nextInvoice(){let r=await db.from("orders").select("invoice_no").order("created_at",{ascending:false}).limit(1),n=1,m=r.data?.[0]?.invoice_no?.match(/(\d+)$/);if(m)n=+m[1]+1;return "NB/"+String(n).padStart(6,"0")}
async function newSale(){rows=products.length?[{product_id:products[0].id,qty:1}]:[];customer.value="";discount.value=0;shipping.value=0;invoice.value=await nextInvoice();render()}
async function saveSale(){msg.textContent="";if(!customer.value.trim())return msg.textContent="Isi nama pemesan.";if(!rows.length)return msg.textContent="Tambahkan minimal satu produk.";let t=totals(),a=await db.from("orders").insert({invoice_no:invoice.value,customer_name:customer.value.trim(),cashier_id:profile.id,subtotal:t.sub,discount:t.d,shipping:t.sh,total:t.total}).select().single();if(a.error)return msg.textContent=a.error.message;let details=rows.map(r=>{let x=p(r.product_id);return{order_id:a.data.id,product_id:x.id,product_name:x.name,qty:r.qty,unit_price:x.price,amount:x.price*r.qty}}),b=await db.from("order_items").insert(details);if(b.error)return msg.textContent=b.error.message;let inv=invoice.value;await newSale();msg.textContent="Tersimpan online: "+inv}
async function show(id){["cashier","products","history"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!=id));if(id=="products")renderProducts();if(id=="history")renderHistory()}
async function renderProducts(){let r=await db.from("products").select("*").order("id");productEditor.innerHTML=(r.data||[]).map(x=>`<div class="row" style="grid-template-columns:1fr 150px 80px 40px"><input value="${esc(x.name)}" onchange="upd(${x.id},'name',this.value)"><input type="number" value="${x.price}" onchange="upd(${x.id},'price',+this.value)"><input type="checkbox" ${x.active?"checked":""} onchange="upd(${x.id},'active',this.checked)"><button class="red" onclick="upd(${x.id},'active',false)">×</button></div>`).join("")}
async function upd(id,k,v){await db.from("products").update({[k]:v}).eq("id",id);await load();renderProducts();render()}
async function addProduct(){let n=prompt("Nama produk");if(!n)return;let pr=+prompt("Harga","0");let r=await db.from("products").insert({name:n,price:pr,active:true});if(r.error)alert(r.error.message);else{await load();renderProducts();render()}}
async function renderHistory(){historyRows.innerHTML="Memuat...";let r=await db.from("orders").select("id,invoice_no,customer_name,subtotal,discount,shipping,total,created_at").order("created_at",{ascending:false});if(r.error){historyRows.innerHTML="<p>"+esc(r.error.message)+"</p>";return}if(!r.data?.length){historyRows.innerHTML="<p>Belum ada transaksi.</p>";return}historyRows.innerHTML=`<div class="history-wrap"><table class="history-table"><tr><th>Invoice</th><th>Pemesan</th><th>Tanggal</th><th>Subtotal</th><th>Diskon</th><th>Shipping</th><th>Total</th><th>Aksi</th></tr>${r.data.map(x=>`<tr><td>${esc(x.invoice_no)}</td><td>${esc(x.customer_name)}</td><td>${new Date(x.created_at).toLocaleString("id-ID")}</td><td>Rp ${rp(x.subtotal)}</td><td>Rp ${rp(x.discount)}</td><td>Rp ${rp(x.shipping)}</td><td><b>Rp ${rp(x.total)}</b></td><td><button class="brown" onclick="openDetail('${x.id}')">Lihat Receipt</button></td></tr>`).join("")}</table></div>`}
async function openDetail(id){let o=await db.from("orders").select("*").eq("id",id).single();if(o.error)return alert(o.error.message);let d=await db.from("order_items").select("*").eq("order_id",id).order("id");if(d.error)return alert(d.error.message);currentDetail={order:o.data,items:d.data||[]};detailReceipt.innerHTML=receiptHTML({invoice:o.data.invoice_no,customer:o.data.customer_name,subtotal:o.data.subtotal,discount:o.data.discount,shipping:o.data.shipping,total:o.data.total,created_at:o.data.created_at,rows:(d.data||[]).map(x=>({qty:x.qty,product_name:x.product_name,unit_price:x.unit_price,amount:x.amount}))});detailModal.classList.remove("hidden")}
function closeDetail(){detailModal.classList.add("hidden");currentDetail=null}
function printHTML(title,body){
  const area=document.getElementById("printArea");
  area.innerHTML=body;
  document.title=title||"Nart Bake E-Receipt";
  window.print();
  setTimeout(()=>{area.innerHTML="";document.title="Nart Bake Online Cashier V2.1"},1000);
}
function printCurrent(){printHTML(invoice.value,receipt.innerHTML)}
function printDetail(){if(currentDetail)printHTML(currentDetail.order.invoice_no,detailReceipt.innerHTML)}
function shareDetailWhatsApp(){if(!currentDetail)return;let o=currentDetail.order,lines=currentDetail.items.map(x=>`${x.qty}x ${x.product_name} - Rp ${rp(x.amount)}`).join("\n"),text=`NART BAKE - E-RECEIPT\nInvoice: ${o.invoice_no}\nPemesan: ${o.customer_name}\n\n${lines}\n\nSubtotal: Rp ${rp(o.subtotal)}\nDiskon: Rp ${rp(o.discount)}\nShipping: Rp ${rp(o.shipping)}\nTOTAL: Rp ${rp(o.total)}\n\nThank you for order ♡`;window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank")}
[customer,discount,shipping].forEach(x=>x.addEventListener("input",render));boot();
</script></body></html>
